name: Build Daymark Health IPA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Use CocoaPods for iOS plugins
        run: flutter config --no-enable-swift-package-manager

      - name: Install Flutter packages
        run: flutter pub get

      - name: Reinstall iOS pods cleanly
        working-directory: ios
        run: |
          pod deintegrate
          rm -rf Pods Podfile.lock
          pod install --repo-update

      - name: Build iOS app without code signing
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          ditto -c -k --sequesterRsrc --keepParent Payload DaymarkHealth.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Daymark-Health-IPA
          path: build/ipa/DaymarkHealth.ipa
          if-no-files-found: error
          retention-days: 14
